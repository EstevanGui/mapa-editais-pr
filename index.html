<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mapa de Editais – Móveis PR</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1d1b; --ink-2:#55544f; --muted:#8a8984; --line:#e3e1db;
    --accent:#1f3a5f; --sigiloso:#9a9a95;
    --r1:#ec7b72; --r2:#e0544b; --r3:#c93530; --r4:#9e2220; --r5:#6b1212;
    --ok:#1e7a46; --warn:#9a6a00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .app{display:grid;grid-template-columns:1fr 380px;height:100vh}
  #map{height:100%;background:var(--bg)}
  aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--bg);border-radius:8px;padding:8px 10px}
  .stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--ink-2)}
  .busca{margin-top:12px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  #lista{overflow:auto;flex:1;padding:4px 0}
  .item{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:12px 1fr;gap:10px}
  .item:hover,.item.ativo{background:#faf8f4}
  .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
  .item .mun{font-weight:600}
  .item .val{font-variant-numeric:tabular-nums}
  .item .obj{color:var(--ink-2);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prazo{font-size:12px;color:var(--ink-2)}
  .prazo.urgente{color:#b3261e;font-weight:600}
  .vazio{padding:24px 16px;color:var(--muted)}
  .legenda{background:var(--panel);padding:10px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15);font-size:12px;line-height:1.6}
  .legenda b{display:block;margin-bottom:4px}
  .legenda i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 2px #fff,0 0 0 3px #ccc}
  .tt{font-size:13px;line-height:1.4}
  .tt b{font-size:14px}
  .km{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:2px 8px;font-weight:600;font-size:12px;box-shadow:none}
  .km::before{display:none}
  .pop h3{margin:0 0 6px;font-size:15px}
  .ed{border-top:1px solid var(--line);padding:8px 0}
  .ed:first-of-type{border-top:0}
  .ed .org{font-weight:600}
  .ed .obj{color:var(--ink-2);font-size:12px;margin:2px 0 4px}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:1px}
  .tag.mdf{background:#e3f2e8;color:var(--ok)}
  .tag.conferir{background:#fdf1d8;color:var(--warn)}
  .tag.total{background:#ececea;color:var(--ink-2)}
  .ed a{color:var(--accent);margin-right:10px;font-size:12px}
  .ed .id{font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all}
  .ed button{font:inherit;font-size:11px;margin-top:4px;padding:3px 8px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
  .ed details{font-size:12px;margin-top:4px}
  .ed details li{margin:2px 0}
  .leaflet-popup-content{margin:12px 14px;max-height:360px;overflow:auto;width:300px!important}
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto}
    #map{height:58vh}
    aside{border-left:0;border-top:1px solid var(--line)}
    #lista{overflow:visible}
    .leaflet-popup-content{width:240px!important}
  }
</style>
</head>
<body>
<div class="app">
  <div id="map" role="application" aria-label="Mapa do Paraná com os editais"></div>
  <aside>
    <header>
      <h1>Editais de móveis / MDF no Paraná</h1>
      <div class="sub" id="atualizado">Carregando…</div>
      <div class="stats">
        <div class="stat"><b id="sN">–</b><span>editais abertos</span></div>
        <div class="stat"><b id="sV">–</b><span>valor de interesse</span></div>
        <div class="stat"><b id="sP">–</b><span>próximo prazo</span></div>
      </div>
      <input class="busca" id="busca" type="search" placeholder="Filtrar por cidade, órgão ou item…" aria-label="Filtrar editais">
    </header>
    <div id="lista" aria-live="polite"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const LONDRINA = [-23.304, -51.1691];
const CORES = ["--r1","--r2","--r3","--r4","--r5"].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const SIGILOSO = getComputedStyle(document.documentElement).getPropertyValue("--sigiloso").trim();

const brl = v => v == null ? "sigiloso" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const brlCurto = v => v == null ? "–" : v >= 1e6 ? "R$ " + (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi"
  : v >= 1e3 ? "R$ " + Math.round(v/1e3).toLocaleString("pt-BR") + " mil" : brl(v);
const dataBR = s => new Date(s + "-03:00").toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", timeZone:"America/Sao_Paulo"});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function faltam(s){
  const ms = new Date(s + "-03:00") - Date.now();
  const h = ms / 36e5;
  if (h < 24) return {txt: `encerra em ${Math.max(1, Math.round(h))}h`, urgente: true};
  const d = Math.floor(h / 24);
  return {txt: `faltam ${d} dia${d > 1 ? "s" : ""}`, urgente: d <= 2};
}
function kmEntre(a, b){
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b[0]-a[0]) * rad, dLon = (b[1]-a[1]) * rad;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*rad) * Math.cos(b[0]*rad) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

// ---------------------------------------------------------------- mapa base
const map = L.map("map", {zoomSnap: 0.25, minZoom: 6}).setView([-24.6, -51.6], 7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a> · IBGE · PNCP',
  subdomains: "abcd", maxZoom: 18
}).addTo(map);

fetch("parana.geojson").then(r => r.json()).then(g => {
  const camada = L.geoJSON(g, {style: {color: "#1f3a5f", weight: 1.5, fill: false, opacity: .6}, interactive: false}).addTo(map);
  map.fitBounds(camada.getBounds(), {padding: [10, 10]});
}).catch(() => {});

L.marker(LONDRINA, {
  icon: L.divIcon({className: "", iconSize: [22,22], iconAnchor: [11,11],
    html: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="16" height="16" rx="3" fill="#1f3a5f" stroke="#fff" stroke-width="2"/><path d="M11 6l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#fff"/></svg>'}),
  zIndexOffset: 1000, keyboard: false
}).addTo(map).bindTooltip("<b>Londrina</b> · sua sede", {direction: "top", offset: [0, -10]});

// ---------------------------------------------------------------- dados
let grupos = [], marcadores = {}, linha = null, rotuloKm = null, limites = [];

function corDoValor(v){
  if (v == null) return SIGILOSO;
  let i = limites.findIndex(l => v <= l);
  return CORES[i < 0 ? CORES.length - 1 : i];
}

function calcularFaixas(valores){
  // 5 faixas por quantis (cada cor tem ~o mesmo numero de cidades)
  const v = valores.filter(x => x != null).sort((a, b) => a - b);
  if (!v.length) return [];
  return [0.2, 0.4, 0.6, 0.8, 1].map(q => v[Math.min(v.length - 1, Math.ceil(q * v.length) - 1)]);
}

function legenda(){
  const ctl = L.control({position: "bottomleft"});
  ctl.onAdd = () => {
    const d = L.DomUtil.create("div", "legenda");
    let html = "<b>Valor de interesse por cidade</b>";
    let ant = 0;
    limites.forEach((l, i) => {
      if (i > 0 && l === limites[i-1]) return;
      html += `<div><i style="background:${CORES[i]}"></i>${i === 0 ? "até " + brlCurto(l) : brlCurto(ant) + " – " + brlCurto(l)}</div>`;
      ant = l;
    });
    html += `<div><i style="background:${SIGILOSO}"></i>valor sigiloso</div>`;
    d.innerHTML = html;
    return d;
  };
  ctl.addTo(map);
}

function mostrarDistancia(g){
  esconderDistancia();
  const destino = [g.lat, g.lon];
  linha = L.polyline([LONDRINA, destino], {color: "#1f3a5f", weight: 2, dashArray: "6 6", interactive: false}).addTo(map);
  const km = Math.round(kmEntre(LONDRINA, destino));
  const meio = [(LONDRINA[0] + g.lat) / 2, (LONDRINA[1] + g.lon) / 2];
  rotuloKm = L.tooltip({permanent: true, direction: "center", className: "km", interactive: false})
    .setLatLng(meio).setContent(km < 5 ? "em Londrina" : `${km} km em linha reta`).addTo(map);
}
function esconderDistancia(){
  if (linha) { map.removeLayer(linha); linha = null; }
  if (rotuloKm) { map.removeLayer(rotuloKm); rotuloKm = null; }
}

function popupHTML(g){
  return `<div class="pop"><h3>${esc(g.municipio)} · ${brl(g.total)}</h3>` + g.editais.map(e => {
    const f = faltam(e.encerramento);
    const tag = {mdf: ["mdf", "MDF confirmado"], misto: ["mdf", "MDF + conferir"], conferir: ["conferir", "material a conferir"], total: ["total", "valor total"]}[e.valor_tipo] || ["total", ""];
    const itens = (e.itens || []).map(i => `<li>${i.mdf ? "✅" : "❓"} ${esc(i.desc)} — ${brl(i.valor)}</li>`).join("");
    const pedido = `Exclui do mapa o edital ${e.id} (${e.municipio} – ${e.orgao})`;
    return `<div class="ed">
      <div class="org">${esc(e.orgao)}</div>
      <div class="obj">${esc(e.objeto)}</div>
      <div><b>${brl(e.valor)}</b><span class="tag ${tag[0]}">${tag[1]}</span></div>
      <div class="prazo ${f.urgente ? "urgente" : ""}">Propostas até ${dataBR(e.encerramento)} · ${f.txt}</div>
      ${itens ? `<details><summary>${e.itens.length} item(ns) de interesse</summary><ul>${itens}</ul></details>` : ""}
      <div><a href="${esc(e.link_pncp)}" target="_blank" rel="noopener">PNCP / PDFs</a>${e.link_sistema ? `<a href="${esc(e.link_sistema)}" target="_blank" rel="noopener">Sistema de disputa</a>` : ""}</div>
      <div class="id">ID: ${esc(e.id)}</div>
      <button type="button" data-copiar="${esc(pedido)}">Copiar pedido de exclusão para a IA</button>
    </div>`;
  }).join("") + "</div>";
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-copiar]");
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.copiar).then(() => { b.textContent = "Copiado! Cole no Claude"; });
});

function desenhar(dados){
  const agora = Date.now();
  const abertos = dados.editais.filter(e => new Date(e.encerramento + "-03:00") > agora);  // some sozinho ao vencer

  const porCidade = {};
  for (const e of abertos) {
    const k = e.ibge || e.municipio;
    (porCidade[k] ??= {municipio: e.municipio, lat: e.lat, lon: e.lon, editais: [], total: 0, sigiloso: false}).editais.push(e);
  }
  grupos = Object.values(porCidade);
  for (const g of grupos) {
    g.editais.sort((a, b) => a.encerramento.localeCompare(b.encerramento));
    const vals = g.editais.map(e => e.valor);
    g.total = vals.some(v => v != null) ? vals.reduce((s, v) => s + (v || 0), 0) : null;
    g.prazo = g.editais[0].encerramento;
  }
  limites = calcularFaixas(grupos.map(g => g.total));
  legenda();

  // maiores por baixo, para os pequenos ficarem clicaveis
  grupos.sort((a, b) => (b.total || 0) - (a.total || 0));
  for (const g of grupos) {
    const m = L.circleMarker([g.lat, g.lon], {
      radius: 8 + Math.min(g.editais.length - 1, 4) * 2,
      fillColor: corDoValor(g.total), fillOpacity: 1, color: "#ffffff", weight: 2
    }).addTo(map);
    m.bindTooltip(`<div class="tt"><b>${esc(g.municipio)}</b><br>${brl(g.total)}<br>${g.editais.length} edital(is) · ${faltam(g.prazo).txt}</div>`,
      {direction: "top", offset: [0, -8]});
    m.bindPopup(() => popupHTML(g), {maxWidth: 320});
    m.on("mouseover", () => { mostrarDistancia(g); m.setStyle({weight: 3, color: "#1f3a5f"}); });
    m.on("mouseout", () => { esconderDistancia(); m.setStyle({weight: 2, color: "#ffffff"}); });
    m.on("popupopen", () => mostrarDistancia(g));
    m.on("popupclose", esconderDistancia);
    marcadores[g.municipio] = {m, g};
  }

  const total = abertos.reduce((s, e) => s + (e.valor || 0), 0);
  document.getElementById("sN").textContent = abertos.length;
  document.getElementById("sV").textContent = brlCurto(total);
  document.getElementById("sP").textContent = abertos.length ? faltam(abertos.map(e => e.encerramento).sort()[0]).txt.replace("encerra em ", "").replace("faltam ", "") : "–";
  document.getElementById("atualizado").textContent = "Atualizado em " + dataBR(dados.gerado_em) + " · some do mapa quando o prazo vence";
  lista(abertos);
}

function lista(abertos){
  const termo = norm(document.getElementById("busca").value);
  const filtrados = abertos.filter(e => !termo || norm([e.municipio, e.orgao, e.objeto, ...(e.itens || []).map(i => i.desc)].join(" ")).includes(termo))
    .sort((a, b) => a.encerramento.localeCompare(b.encerramento));
  const el = document.getElementById("lista");
  if (!filtrados.length) { el.innerHTML = '<div class="vazio">Nenhum edital aberto com esse filtro.</div>'; return; }
  el.innerHTML = filtrados.map(e => {
    const f = faltam(e.encerramento);
    const g = marcadores[e.municipio]?.g;
    return `<div class="item" tabindex="0" data-mun="${esc(e.municipio)}">
      <span class="dot" style="background:${corDoValor(g ? g.total : e.valor)}"></span>
      <div><div><span class="mun">${esc(e.municipio)}</span> · <span class="val">${brl(e.valor)}</span></div>
      <div class="obj">${esc(e.orgao)} — ${esc(e.objeto)}</div>
      <div class="prazo ${f.urgente ? "urgente" : ""}">${dataBR(e.encerramento)} · ${f.txt}</div></div></div>`;
  }).join("");
}

let DADOS = null;
document.getElementById("busca").addEventListener("input", () => DADOS && lista(DADOS.editais.filter(e => new Date(e.encerramento + "-03:00") > Date.now())));
document.getElementById("lista").addEventListener("click", ev => {
  const it = ev.target.closest(".item"); if (!it) return;
  const alvo = marcadores[it.dataset.mun]; if (!alvo) return;
  map.flyTo(alvo.m.getLatLng(), Math.max(map.getZoom(), 8), {duration: .6});
  setTimeout(() => alvo.m.openPopup(), 650);
});
document.getElementById("lista").addEventListener("mouseover", ev => {
  const it = ev.target.closest(".item"); const alvo = it && marcadores[it.dataset.mun];
  if (alvo) mostrarDistancia(alvo.g);
});
document.getElementById("lista").addEventListener("mouseleave", esconderDistancia);
document.getElementById("lista").addEventListener("keydown", ev => { if (ev.key === "Enter") ev.target.closest(".item")?.click(); });

fetch("editais.json?" + Date.now()).then(r => r.json()).then(d => { DADOS = d; desenhar(d); })
  .catch(() => { document.getElementById("atualizado").textContent = "Não foi possível carregar os editais."; });
</script>
</body>
</html>
